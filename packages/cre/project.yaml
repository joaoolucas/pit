# Cell — Chainlink CRE project configuration.
#
# `cre init` writes this file; it is checked in so the workflow is reproducible.
# If a newer CLI rejects a field, regenerate with `cre init` and re-apply the two
# things that are actually ours: the Monad RPC and the target names below.
#
# Secrets live in .env (CRE_ETH_PRIVATE_KEY), never here.

cre-cli-version: ">=0.3.0"

targets:
  staging-settings:
    workflow-registry:
      chain-name: ethereum-testnet-sepolia
    rpcs:
      - chain-name: monad-testnet
        url: ${MONAD_RPC_URL}
      - chain-name: ethereum-testnet-sepolia
        url: ${SEPOLIA_RPC_URL}
    logging:
      seth-config-path: ""

  production-settings:
    workflow-registry:
      chain-name: ethereum-mainnet
    rpcs:
      - chain-name: monad-mainnet
        url: ${MONAD_MAINNET_RPC_URL}
      - chain-name: ethereum-mainnet
        url: ${ETHEREUM_RPC_URL}
    logging:
      seth-config-path: ""
