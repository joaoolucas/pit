# Pit — Chainlink CRE project configuration.
#
# Schema for CRE CLI >= 1.14: targets are top-level keys, not nested under
# `targets:`. `cre-cli-version` below is leftover from an older init and is
# ignored. RPCs are public endpoints so simulate works without a vendor key.
#
# Secrets live in .env (CRE_ETH_PRIVATE_KEY), never here.

staging-settings:
  rpcs:
    - chain-name: monad-testnet
      url: https://testnet-rpc.monad.xyz
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

production-settings:
  rpcs:
    - chain-name: monad-mainnet
      url: https://rpc.monad.xyz
    - chain-name: ethereum-mainnet
      url: https://ethereum-rpc.publicnode.com
